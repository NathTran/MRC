<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Défi du vendeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, ludique : escape game de révision pour des 2de MRC en binôme
   IDEA le plan d'un magasin de sport : chaque rayon est une épreuve, chaque rayon validé livre une lettre du code
   PICTURE le plan du magasin (6 rayons en tuiles) avec la bande des lettres C-L-I-E-N-T à reconstituer
   COLOUR blanc, bleu magasin #0b3d91, orange balise #ff6a13, une teinte par rayon pour les tuiles
   TYPE Barlow Condensed (signalétique) + Barlow
   LAYOUT colonne 860px ; plan en grille 3x2 sur ordinateur, 2x3 à 720px, 1 colonne sur téléphone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1420);--ink:light-dark(#111827,#eef2f8);--mute:light-dark(#4b5563,#a9b4c4);--blue:light-dark(#0b3d91,#6d9bf2);--head:light-dark(#0b3d91,#14264a);--orange:#ff6a13;--card:light-dark(#f3f6fb,#172133);--line:light-dark(#d6deea,#2b3a52);--ok:light-dark(#11804a,#3ccf86);--okBg:light-dark(#e5f6ec,#123726);--ko:light-dark(#c62828,#ff7a7a);--koBg:light-dark(#fdeaea,#3a1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.disp{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;letter-spacing:-.01em}
header{background:var(--head);color:#fff;padding:16px max(5vw,16px)}
header .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:clamp(26px,4.5vw,34px);margin:0}
header .meta{display:flex;gap:14px;font:600 16px Barlow,sans-serif;color:#d7e3fb;flex-wrap:wrap}
header .meta b{color:#fff;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.code{display:flex;gap:8px;justify-content:center;margin:4px 0 18px}
.code span{width:46px;height:54px;border-radius:8px;border:3px dashed var(--line);display:grid;place-items:center;font:700 30px "Barlow Condensed";color:var(--mute)}
.code span.got{border:3px solid var(--orange);background:var(--orange);color:#fff}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rayon{position:relative;text-align:left;border:0;border-radius:12px;padding:14px;min-height:150px;color:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden}
.rayon h3{font-size:24px;margin:0}
.rayon small{display:block;font-size:14px;opacity:.95}
.rayon .lt{position:absolute;right:12px;bottom:6px;font:700 64px/1 "Barlow Condensed";opacity:.28}
.rayon .st{font:600 14px Barlow,sans-serif;background:rgba(0,0,0,.22);border-radius:20px;padding:3px 10px;align-self:flex-start}
.rayon[disabled]{filter:grayscale(.85);opacity:.55;cursor:not-allowed}
.rayon:focus-visible,.btn:focus-visible,.opt:focus-visible,.cat:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-bottom:14px}
.intro h2{font-size:clamp(28px,5vw,40px);margin:0 0 4px}
.intro p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.tag{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;padding:9px 16px;font:600 15px Barlow,sans-serif;background:var(--blue)}
.tag b{font-family:"Barlow Condensed";font-size:19px}
.pad{padding:16px}
.pad p{margin:0 0 10px}
.cons{font-weight:600}
label.cons{display:block;margin-bottom:6px}
.item{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.item.good{border-color:var(--ok);background:var(--okBg)}
.item.bad{border-color:var(--ko);background:var(--koBg)}
.item .why{font-size:15px;color:var(--mute);margin-top:6px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cat{font:600 15px Barlow,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;min-height:40px;cursor:pointer}
.cat.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cat.ans{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
select,input[type=text],textarea{font:16px Barlow,sans-serif;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.45}
textarea.long{min-height:260px}
select:focus,input:focus,textarea:focus{outline:3px solid var(--orange);outline-offset:1px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15em);gap:10px;align-items:center}
.say{display:flex;gap:10px;margin:0 0 8px;align-items:flex-start}
.who{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px Barlow,sans-serif;color:#fff;background:var(--orange)}
.who.v{background:var(--blue)}
.bub{background:var(--bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 12px}
.bub small{display:block;color:var(--mute);font-size:13px;font-weight:600}
button.line{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
button.line.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--bg))}
button.line.good{border-color:var(--ok);background:var(--okBg)}
button.line.bad{border-color:var(--ko);background:var(--koBg)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:500 16px/1.4 Barlow,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 14px;min-height:46px;cursor:pointer;margin-bottom:9px}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:700 14px Barlow,sans-serif}
.opt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--bg))}
.opt.good{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--ko);background:var(--koBg)}
.pieces{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.piece{font:600 16px Barlow,sans-serif;border:2px dashed var(--blue);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:44px}
.piece[disabled]{opacity:.3;cursor:default}
.seq{min-height:52px;border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg)}
.seq span{background:var(--blue);color:#fff;border-radius:8px;padding:7px 11px;font-weight:600}
.seq span.good{background:var(--ok)}.seq span.bad{background:var(--ko)}
input[type=range]{width:100%;accent-color:var(--orange);height:32px}
.meter{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.val{font:700 26px "Barlow Condensed";color:var(--blue);white-space:nowrap}
.model{border-left:5px solid var(--ok);background:var(--okBg);padding:10px 12px;border-radius:8px;margin:8px 0;white-space:pre-wrap}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ok)}
.fb{padding:12px 14px;border-radius:10px;border-left:5px solid var(--ok);background:var(--okBg);margin-top:4px}
.fb.mid{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--bg))}
.fb b{font-family:"Barlow Condensed";font-size:21px}
.btn{font:700 18px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.02em;border:0;border-radius:10px;padding:11px 20px;min-height:48px;cursor:pointer;background:var(--orange);color:#fff}
.btn.sec{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.act{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--orange)}.steps i.c{background:var(--blue)}
.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.timer i{display:block;height:100%;background:var(--orange)}
table.st{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 10px;background:var(--bg)}
table.st th,table.st td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.st th{background:var(--blue);color:#fff}
.memo td:first-child{font-weight:600;width:30%}
.cert{text-align:center;padding:24px 16px;border:4px double var(--orange);border-radius:14px;background:var(--bg)}
.cert .big{font:700 clamp(48px,10vw,72px)/1 "Barlow Condensed";color:var(--blue)}
.note{font-size:14px;color:var(--mute);margin-top:22px}
#msg{text-align:right;color:var(--mute);font-size:15px;margin:6px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:420px;margin:0}
.memo-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mc{min-height:104px;border-radius:10px;border:2px solid var(--line);background:var(--blue);color:#fff;font:600 15px/1.3 Barlow,sans-serif;padding:8px;cursor:pointer;display:grid;place-items:center;text-align:center}
.mc.back{font:700 34px "Barlow Condensed",sans-serif;background:repeating-linear-gradient(45deg,var(--blue) 0 10px,color-mix(in srgb,var(--blue) 85%,#fff) 10px 20px)}
.mc.up{background:var(--bg);color:var(--ink);border-color:var(--orange)}
.mc.t{font-weight:700;font-size:17px}
.mc.found{background:var(--okBg);color:var(--ink);border-color:var(--ok);cursor:default}
.trous{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;line-height:2.3}
.trous select{width:auto;display:inline-block;padding:4px 8px;font-size:16px;margin:0 2px;max-width:100%}
.trous select.good{border-color:var(--ok);background:var(--okBg)}
.trous select.bad{border-color:var(--ko);background:var(--koBg)}
.trous .cor{color:var(--ok);font-weight:600;font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.bank span{border:1px dashed var(--blue);border-radius:6px;padding:2px 8px;font-size:15px;background:var(--bg)}
.cwrap{overflow-x:auto;padding-bottom:6px}
.cw{display:grid;gap:2px;width:max-content;margin:0 auto 12px}
.cw div{width:clamp(24px,6.4vw,34px);height:clamp(24px,6.4vw,34px);position:relative}
.cw .x{background:transparent}
.cw input{width:100%;height:100%;padding:0;border:2px solid var(--blue);border-radius:3px;text-align:center;font:700 clamp(14px,3.6vw,19px) Barlow,sans-serif;text-transform:uppercase;background:var(--bg);color:var(--ink)}
.cw input:focus{outline:3px solid var(--orange);outline-offset:0;background:color-mix(in srgb,var(--orange) 12%,var(--bg))}
.cw input.good{background:var(--okBg);border-color:var(--ok)}
.cw input.bad{background:var(--koBg);border-color:var(--ko)}
.cw b{position:absolute;left:2px;top:0;font-size:9px;line-height:1;color:var(--mute);pointer-events:none;z-index:1}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;font-size:15px}
.clues h4{margin:0 0 4px;font:700 19px "Barlow Condensed",sans-serif}
.clues p{margin:0 0 5px;cursor:pointer}
.clues p.ok{color:var(--ok)}
.clues p.ko{color:var(--ko)}
@media(max-width:720px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.memo-g{grid-template-columns:repeat(3,minmax(0,1fr))}.clues{grid-template-columns:minmax(0,1fr)}.map{grid-template-columns:minmax(0,1fr)}.rayon{min-height:112px}.row2,.intro{grid-template-columns:minmax(0,1fr)}.code span{width:40px;height:48px;font-size:26px}}
@media print{header,.act,.note,.code,#msg{display:none}}
</style>
</head>
<body>
<header><div class="in"><h1>Le Défi du vendeur — Sport Évasion</h1><div class="meta" id="meta"></div></div></header>
<main><div id="app"></div>
<p class="note"><span id="prof">Mme TRAN</span> — 2de Bac Pro MRC — révision « La communication professionnelle ». Situations fictives créées pour l'entraînement. Vos réponses restent sur cet ordinateur.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
{
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ACC=["Un bon vendeur, c'est surtout quelqu'un qui parle bien.","Le client retient surtout les mots que le vendeur prononce.","Reformuler, c'est parler de façon plus professionnelle."];
const ACCO=["D'accord","Pas sûr(e)","Pas d'accord"];
const CWDATA=[["RECEPTEUR", "Celui qui reçoit le message", 12, 5, "a"], ["EMETTEUR", "Celui qui envoie le message", 5, 5, "d"], ["SBAM", "Sourire, Bonjour, Au revoir, Merci", 6, 2, "a"], ["FAMILIER", "Registre de langue interdit face au client", 5, 13, "d"], ["FEEDBACK", "La réponse du récepteur", 10, 4, "a"], ["INTIME", "Zone de moins de 45 cm, où l'on n'entre jamais", 8, 3, "a"], ["OUVERTE", "Question qui laisse le client s'exprimer", 2, 8, "d"], ["SYNTHESE", "Reformulation qui résume toutes les attentes du client", 0, 2, "d"], ["EXCUSES", "On les présente au client mécontent, au nom du magasin", 3, 5, "a"], ["BRUIT", "Tout ce qui gêne le message", 6, 7, "a"], ["ECHO", "Reformulation qui reprend les derniers mots du client", 4, 0, "a"], ["VISUEL", "Client sensible aux couleurs et à l'aspect", 0, 0, "a"], ["CANAL", "Le moyen par lequel passe le message : oral, téléphone, écrit", 2, 0, "a"]];
const LV=[
{l:"N",n:"Rayon Communication",c:"#0b3d91",min:20,sub:"Schéma de la communication, verbal, non verbal, para-verbal",acts:[
 {id:"c1",type:"assign",title:"Qui fait quoi ?",cons:"Associez chaque élément de la scène à son rôle dans le schéma de la communication.",
  ctx:"Au rayon vélo, M. PETIT demande à Chloé, vendeuse : « Ce casque existe en taille L ? ». Au même moment, l'alarme de la porte d'entrée sonne. Chloé répond : « Oui, je vais vous le chercher en réserve. »",
  opts:["Émetteur","Récepteur","Message","Canal","Bruit","Feedback"],
  items:[["M. PETIT",0],["Chloé",1],["« Ce casque existe en taille L ? »",2],["La voix, en face à face",3],["L'alarme de la porte",4],["« Oui, je vais vous le chercher en réserve. »",5]],
  why:"Le bruit, c'est tout ce qui gêne le message (un son, la distance, l'inattention). Le feedback est la réponse du récepteur : il montre que le message a été compris."},
 {id:"c2",type:"tri",title:"Tri express",cons:"Pour chaque comportement d'un vendeur, choisissez : verbal (les mots), non verbal (le corps) ou para-verbal (la voix).",
  cats:["Verbal","Non verbal","Para-verbal"],
  items:[["Croiser les bras",1],["Dire « Je vous en prie »",0],["Parler très vite",2],["Regarder le client dans les yeux",1],["Soupirer",2],["Dire « Bah, c'est pareil »",0],["Hausser le ton",2],["Avoir les mains dans les poches",1],["Utiliser le mot « truc »",0]]},
 {id:"c3",type:"memory",title:"Memory du vocabulaire",cons:"Retournez les cartes deux par deux pour associer chaque mot à sa définition. Moins vous faites d'erreurs, plus vous gagnez de points.",
  pairs:[["Émetteur","Celui qui envoie le message"],["Récepteur","Celui qui reçoit le message"],["Canal","Le moyen : oral, téléphone, écrit"],["Bruit","Tout ce qui gêne le message"],["Feedback","La réponse du récepteur"],["Para-verbal","La voix : volume, débit, ton"]]}
]},
{l:"T",n:"Rayon Accueil",c:"#c2410c",min:20,sub:"SBAM, posture, tenue, distances, canaux de contact",acts:[
 {id:"l1",type:"tri",title:"Adapté ou pas ?",cons:"Ce comportement respecte-t-il une charte d'accueil ?",cats:["Adapté","Pas adapté"],
  items:[["Saluer le client dans les 30 secondes",0],["Finir son message sur son téléphone avant d'aller voir le client",1,"Le client passe toujours avant le téléphone."],["Porter son badge bien visible",0],["Mâcher un chewing-gum à la caisse",1],["Garder le buste droit et les mains visibles",0],["S'appuyer contre une étagère en parlant au client",1,"Posture relâchée : le client se sent peu considéré."],["Dire « Merci, au revoir, bonne journée » au client qui part",0],["Rester derrière le comptoir pour conseiller",1,"On va vers le client pour le conseiller."]]},
 {id:"l2",type:"slider",title:"Le bon mètre",cons:"Réglez la distance à laquelle vous vous placez dans chaque situation.",
  items:[["Vous saluez un client qui entre dans le magasin.",1.2,3.6,"Zone sociale (1,20 m à 3,60 m) : pour saluer et aborder."],["Vous aidez un client à régler son casque de vélo.",0.45,1.2,"Zone personnelle (45 cm à 1,20 m) : pour conseiller et faire essayer."],["Vous présentez un nouveau tapis de course à un groupe de 15 personnes.",3.6,5,"Zone publique (plus de 3,60 m) : pour s'adresser à un groupe."],["Vous expliquez à une cliente comment entretenir sa tente.",0.45,1.2,"Zone personnelle : on conseille à distance de bras, sans entrer dans la zone intime (moins de 45 cm)."]]},
 {id:"l3",type:"tri",title:"Quel canal ?",cons:"Par quel canal le client entre-t-il en contact avec le magasin ? (Le magasin est omnicanal : il répond partout.)",cats:["Face à face","Téléphone","Écrit (courriel, chat, avis)"],
  items:[["Un client vous demande un conseil au rayon running.",0],["Une cliente appelle pour connaître les horaires de Noël.",1,"Au téléphone, le client ne vous voit pas : seuls la voix et les mots comptent."],["Un client se plaint par courriel d'une commande en retard.",2],["Une cliente laisse un avis sur internet après son passage.",2],["Un client demande sur le chat du site si un article est en stock.",2]]},
 {id:"l4",type:"trous",title:"La charte d'accueil à compléter",cons:"Complétez la charte d'accueil de Sport Évasion avec les mots proposés. Attention, il y a des intrus.",
  text:"Le vendeur salue chaque client dans les [[30]] secondes. Il applique la règle [[SBAM]] : sourire, bonjour, au revoir, merci. Il range son [[téléphone]] et va vers le client.\nIl adopte une posture [[ouverte]] : buste droit, mains [[visibles]], regard franc. Sa tenue est soignée et son [[badge]] est visible.\nPour conseiller, il se place dans la zone [[personnelle]], entre 45 cm et [[1,20 m]]. Il n'entre jamais dans la zone [[intime]].\nAu téléphone, le client ne voit pas le vendeur : seuls les mots et la [[voix]] comptent.",
  extra:["10","fermée","dans les poches","sociale","3,60 m","publique","chewing-gum","posture"]}
]},
{l:"C",n:"Rayon Langage",c:"#7c3aed",min:25,sub:"Registre de langue, questions, accueil téléphonique, mots croisés",acts:[
 {id:"i1",type:"write",title:"Le traducteur pro",cons:"Réécrivez chaque phrase dans un langage professionnel. Ensuite, comparez avec la proposition et cochez honnêtement ce que vous avez réussi.",
  items:[["« Ouais, vous voulez quoi ? »","« Bonjour Monsieur, que puis-je faire pour vous ? »"],["« J'sais pas, faut demander à quelqu'un d'autre. »","« Je vais me renseigner auprès de mon collègue et je reviens vers vous. »"],["« Bah c'est pareil en gros, c'est juste plus cher. »","« Je vais vous montrer la différence entre les deux modèles. »"],["« Attendez, j'suis occupé là. »","« Je suis à vous dans un instant, Madame. »"]],
  checks:["Aucun mot familier","Une formule de politesse (Monsieur, Madame, je vous en prie…)","J'aide ou je propose quelque chose au client"]},
 {id:"i2",type:"tri",title:"Ouverte ou fermée ?",cons:"Une question ouverte laisse le client s'exprimer. Une question fermée appelle une réponse courte (oui, non, un choix). Classez ces questions.",cats:["Ouverte","Fermée"],
  items:[["« Quelle activité pratiquez-vous ? »",0],["« Vous courez sur route ? »",1],["« Comment utilisez-vous votre vélo ? »",0],["« Vous voulez la taille M ? »",1],["« Qu'attendez-vous de vos nouvelles chaussures ? »",0],["« C'est pour offrir ? »",1]],
  why:"Pour découvrir le besoin, on commence par des questions ouvertes ; les questions fermées servent ensuite à préciser ou à faire choisir."},

 ["compléter un schéma de communication à partir d'un dialogue","classer un comportement en verbal, non verbal ou para-verbal et dire son effet","réécrire une phrase familière en langage professionnel","choisir la bonne distance selon la situation","repérer si un client est visuel, auditif ou kinesthésique","rédiger une reformulation écho et une reformulation synthèse","relever les erreurs d'un vendeur face à une réclamation","rédiger un courriel de réponse complet"].forEach(t=>{if(y>287){doc.addPage();head()}doc.rect(m,y-3.2,3.6,3.6);doc.text(t,m+6,y);y+=5.6});
 return doc.output("blob");
}
function makePdf(){
 const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const m=15,W=180;let y=20;
 const put=(t,sz=10.5,bold=false,col=[17,24,39],gap=1.4)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(sz);doc.setTextColor(...col);String(t).split("\n").forEach(par=>{doc.splitTextToSize(par||" ",W).forEach(l=>{if(y>283){doc.addPage();y=16}doc.text(l,m,y);y+=sz*.42})});y+=gap};
 doc.setFillColor(11,61,145);doc.rect(0,0,210,11,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text("2de Bac Pro MRC — Révision : la communication professionnelle",m,7.5);
 put("Bilan — Le Défi du vendeur",18,true,[11,61,145],2);put("Équipe : "+S.noms,12,true);put("Date : "+new Date().toLocaleDateString("fr-FR")+"   —   Score : "+total()+" / "+totMax+" points",11,false,[75,85,99],4);
 put("Résultats par rayon",13,true,[11,61,145],1);LV.forEach((v,i)=>put(v.n+" : "+lvScore(i)+" / "+lvMax(i)+((S.tries[i]||1)>1?" (réussi en "+S.tries[i]+" essais)":""),10.5,false,[17,24,39],.3));y+=3;
 put("Accroche : avant / après",13,true,[11,61,145],1);ACC.forEach((t,i)=>put("« "+t+" »  Avant : "+(S.acc.b[i]!=null?ACCO[S.acc.b[i]]:"—")+"  /  Après : "+(S.acc.a[i]!=null?ACCO[S.acc.a[i]]:"—"),10,false,[17,24,39],.6));
 if(S.acc.w)put("Notre justification : "+S.acc.w,10,false,[75,85,99],3);
 put("Nos productions écrites",13,true,[11,61,145],1);
 LV.forEach(v=>v.acts.filter(a=>a.type==="write").forEach(a=>{const st=A(a.id);put(a.title,11.5,true,[255,106,19],.8);a.items.forEach((it,k)=>{const checks=Array.isArray(it[2])?it[2]:a.checks;put(it[0],10.5,true,[17,24,39],.4);put(st.txt[k]||"(pas de réponse)",10,false,[17,24,39],.6);put("Auto-évaluation : "+checks.map((c,j)=>(st.chk[k+"-"+j]?"[x] ":"[ ] ")+c).join("  "),9,false,[75,85,99],2.5)})}));
 return doc.output("blob");
}
async function savePdf(syn){const msg=document.getElementById("msg");if(!window.jspdf){try{window.print()}catch(e){}msg.textContent="Choisissez « Enregistrer au format PDF » dans la fenêtre d'impression.";return}
 const name=syn?"Fiche_synthese_communication_pro_2MRC.pdf":"Bilan_Defi_vendeur_"+(S.noms||"equipe").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").slice(0,60)+".pdf",blob=syn?makeSyn():makePdf();
 const fb=()=>{const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=name;document.body.appendChild(l);l.click();l.remove()};
 if(DL){try{await DL.save({filename:name,data:blob});msg.textContent="Bilan enregistré."}catch(e){msg.textContent=e&&e.code==="declined"?"Enregistrement annulé.":"Enregistrement impossible ici.";if(!e||e.code!=="declined"){try{fb()}catch(x){}}}return}
 try{fb();msg.textContent="Le PDF a été téléchargé."}catch(e){msg.textContent="Enregistrement impossible ici."}}
app.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
 if(b.id==="unlock"){const v=document.getElementById("code0").value;if(hc(v)===CODE_SEANCE||hc(v)===CODE_PROF){S.ok=true;render();if(S.noms)askResume()}else{document.getElementById("code0m").textContent="Code incorrect. Attendez le code donné en classe."}return}
 if(b.id==="go"){const n=document.getElementById("noms").value.trim();if(!n){document.getElementById("noms").focus();return}S.noms=n;S.t0=S.t0||Date.now();S.scr="acc";save();render();return}
 if(d.acc!==undefined){S.acc.w=document.getElementById("accw").value;S.acc.b[+d.acc]=+d.v;save();render();return}
 if(b.id==="accok"){S.acc.w=document.getElementById("accw").value;S.scr="home";save();render();return}
 if(d.lv!==undefined){S.lv=+d.lv;const v=LV[S.lv];if(lvTried(S.lv)&&!S.done.includes(S.lv))resetLv(S.lv);S.ai=Math.max(0,v.acts.findIndex(a=>!A(a.id).done));if(v.acts.every(a=>A(a.id).done))S.ai=0;S.scr="lvl";save();render();window.scrollTo(0,0);return}
 if(b.id==="map"){S.scr="home";save();render();window.scrollTo(0,0);return}
 if(b.id==="newg"){askNew();return}
 if(b.id==="tofinal"){S.scr="final";save();render();window.scrollTo(0,0);return}
 if(S.scr==="lvl"){const a=LV[S.lv].acts[S.ai],st=A(a.id);
  if(d.v!==undefined&&d.k!==undefined&&!st.done){st.sel[+d.k]=+d.v;save();render();return}
  if(a.type==="spot"&&d.k!==undefined&&!st.done){st.sel[+d.k]=!st.sel[+d.k];save();render();return}
  if(d.pc!==undefined){(st.sel.seq=st.sel.seq||[]).push(+d.pc);save();render();return}
  if(b.id==="clr"){st.sel.seq=[];save();render();return}
  if(d.o!==undefined&&!st.done){st.sel.p=+d.o;save();render();return}
  if(b.id==="reveal"){if(Object.values(st.txt).filter(x=>x&&x.trim()).length<a.items.length){alertIn("Écrivez d'abord toutes vos réponses : c'est en essayant que l'on progresse.");return}st.ph=1;save();render();return}
  if(b.id==="check"){check();return}
  if(b.id==="bstart"){st.sel.i=0;st.sel.res=[];st.sel.ts=Date.now();save();render();tick();return}
  if(d.bo!==undefined){bossAnswer(+d.bo);return}
  if(d.mc!==undefined){memClick(+d.mc);return}
  if(b.id==="next"){const v=LV[S.lv];if(S.ai<v.acts.length-1){S.ai++}else{const i=S.lv;if(S.done.includes(i)||lvOk(i)){if(!S.done.includes(i))S.done.push(i);S.scr="home";save();render();window.scrollTo(0,0);celebrate(v);return}S.scr="home";save();render();window.scrollTo(0,0);failed(i);return}save();render();window.scrollTo(0,0);return}
 }
 if(b.id==="cdok"){const v=document.getElementById("cd").value.trim().toUpperCase();S.codeTry=v;if(v==="CLIENT"){S.code=true;save();render();window.scrollTo(0,0)}else{document.getElementById("cdm").textContent="Ce n'est pas le bon mot. Indice : c'est la personne au centre de tout votre métier.";save()}return}
 if(d.acc2!==undefined){S.acc.a[+d.acc2]=+d.v;save();render();return}
 if(b.id==="pdf"){savePdf();return}
 if(b.id==="syn"){savePdf(true);return}
});
app.addEventListener("click",ev=>{const p=ev.target.closest("[data-cwl]");if(!p||S.scr!=="lvl")return;const a=LV[S.lv].acts[S.ai],w=a.words[+p.dataset.cwl];cwDir=w[4];const el=app.querySelector(`[data-cw="${w[2]},${w[3]}"]`);if(el){el.focus();el.select()}});
app.addEventListener("dblclick",ev=>{if(ev.target.dataset.cw){cwDir=cwDir==="a"?"d":"a"}});
app.addEventListener("focusin",ev=>{const k=ev.target.dataset?.cw;if(!k||S.scr!=="lvl")return;const a=LV[S.lv].acts[S.ai];const [rr,cc]=k.split(",").map(Number);const inA=a.words.some(w=>w[4]==="a"&&w[2]===rr&&cc>=w[3]&&cc<w[3]+w[0].length),inD=a.words.some(w=>w[4]==="d"&&w[3]===cc&&rr>=w[2]&&rr<w[2]+w[0].length);if(cwDir==="a"&&!inA)cwDir="d";else if(cwDir==="d"&&!inD)cwDir="a"});
app.addEventListener("keydown",ev=>{const k=ev.target.dataset?.cw;if(!k)return;if(ev.key==="Backspace"&&!ev.target.value){ev.preventDefault();cwMove(k,-1)}else if(ev.key==="ArrowRight"){cwDir="a";cwMove(k,1)}else if(ev.key==="ArrowLeft"){cwDir="a";cwMove(k,-1)}else if(ev.key==="ArrowDown"){cwDir="d";cwMove(k,1)}else if(ev.key==="ArrowUp"){cwDir="d";cwMove(k,-1)}});
app.addEventListener("input",ev=>{const t=ev.target;if(S.scr!=="lvl")return;const a=LV[S.lv].acts[S.ai],st=A(a.id);
 if(t.dataset.cw){const v=norm(t.value).replace(/[^A-Z]/g,"").slice(-1);t.value=v;(st.sel.g=st.sel.g||{})[t.dataset.cw]=v;save();if(v)cwMove(t.dataset.cw,1);return}
 if(t.tagName==="TEXTAREA"&&t.dataset.k!==undefined){st.txt[+t.dataset.k]=t.value;save()}
 if(t.type==="range"){st.sel[+t.dataset.k]=+t.value;document.getElementById("v"+t.dataset.k).textContent=(+t.value).toFixed(2).replace(".",",")+" m";save()}});
app.addEventListener("change",ev=>{const t=ev.target;if(S.scr!=="lvl")return;const a=LV[S.lv].acts[S.ai],st=A(a.id);
 if(t.tagName==="SELECT"){st.sel[+t.dataset.k]=t.value===""?undefined:+t.value;save()}
 if(t.type==="checkbox"){st.chk[t.dataset.ck]=t.checked;save()}});
app.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="code0")document.getElementById("unlock").click();if(ev.key==="Enter"&&ev.target.id==="noms")document.getElementById("go").click();if(ev.key==="Enter"&&ev.target.id==="cd")document.getElementById("cdok").click()});
function alertIn(t){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><div class="pad"><p>${esc(t)}</p><div class="act"><button class="btn" id="mok">D'accord</button></div></div></div>`;document.body.appendChild(m);m.querySelector("#mok").onclick=()=>m.remove();m.querySelector("#mok").focus()}
function celebrate(v){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><div class="tag" style="background:${v.c}"><b>${esc(v.n)} validé !</b></div><div class="pad" style="text-align:center"><p>Vous gagnez la lettre</p><p class="disp" style="font-size:72px;margin:0;color:${v.c}">${v.l}</p><div class="act" style="justify-content:center"><button class="btn" id="mok">Retour au plan</button></div></div></div>`;document.body.appendChild(m);const k=m.querySelector("#mok");k.onclick=()=>m.remove();k.focus()}
function failed(i){const v=LV[i],m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><div class="tag" style="background:${v.c}"><b>${esc(v.n)} : pas encore de lettre</b></div><div class="pad"><p>Vous avez obtenu <b>${lvScore(i)} / ${lvMax(i)} points</b>. Pour gagner la lettre, il faut au moins <b>${esc(need(i))}</b>.</p><p>Relisez les corrections, puis refaites le rayon en prenant votre temps. Vos textes déjà écrits sont conservés.</p><div class="act"><button class="btn sec" id="mno">Retour au plan</button><button class="btn" id="mredo">Refaire le rayon</button></div></div></div>`;document.body.appendChild(m);m.querySelector("#mno").onclick=()=>{m.remove();render()};const k=m.querySelector("#mredo");k.onclick=()=>{m.remove();resetLv(i);S.lv=i;S.ai=0;S.scr="lvl";save();render();window.scrollTo(0,0)};k.focus()}
function askNew(){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><div class="tag"><b>Commencer une nouvelle partie ?</b></div><div class="pad"><p>La partie de l'équipe <b>${esc(S.noms)}</b> sera effacée de cet ordinateur. Pensez à enregistrer le bilan PDF avant si besoin.</p><div class="act"><button class="btn sec" id="nno">Annuler</button><button class="btn" id="nyes">Effacer et recommencer</button></div></div></div>`;document.body.appendChild(m);m.querySelector("#nno").onclick=()=>m.remove();m.querySelector("#nyes").onclick=()=>{m.remove();S=Object.assign(fresh(),{ok:true});save();render();window.scrollTo(0,0)};m.querySelector("#nno").focus()}
function askResume(){const m=document.createElement("div");m.className="modal";const n=S.done.length;m.innerHTML=`<div class="card"><div class="tag"><b>Une partie est déjà en cours</b></div><div class="pad"><p>Équipe : <b>${esc(S.noms)}</b><br>${n} rayon${n>1?"s":""} validé${n>1?"s":""} sur 6 — ${total()} points.</p><p>C'est votre équipe ? Reprenez votre partie. Sinon, commencez une nouvelle partie.</p><div class="act"><button class="btn sec" id="rnew">Nouvelle partie</button><button class="btn" id="rgo">Reprendre</button></div></div></div>`;document.body.appendChild(m);m.querySelector("#rgo").onclick=()=>m.remove();m.querySelector("#rnew").onclick=()=>{m.remove();S=Object.assign(fresh(),{ok:true});save();render();window.scrollTo(0,0)};m.querySelector("#rgo").focus()}
let clicks=0;document.getElementById("prof").addEventListener("click",()=>{if(++clicks>=3){clicks=0;const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><div class="tag"><b>Espace enseignant</b></div><div class="pad"><div id="pz"><label class="cons" for="pc">Code enseignant</label><input type="text" id="pc" autocomplete="off" style="max-width:220px"><p class="why" id="pcm"></p><div class="act"><button class="btn sec" id="pcx">Fermer</button><button class="btn" id="pcok">Valider</button></div></div><div class="act" id="pa" style="justify-content:flex-start;display:none"><button class="btn" id="unl">${S.all?"Refermer":"Ouvrir"} tous les rayons</button><button class="btn sec" id="rst">Effacer cette partie</button><button class="btn sec" id="cls">Fermer</button></div></div></div>`;document.body.appendChild(m);m.querySelector("#pcx").onclick=()=>m.remove();const pc=m.querySelector("#pc");pc.focus();const pok=()=>{if(hc(pc.value)===CODE_PROF){m.querySelector("#pz").style.display="none";m.querySelector("#pa").style.display="flex"}else{m.querySelector("#pcm").textContent="Code incorrect."}};m.querySelector("#pcok").onclick=pok;pc.addEventListener("keydown",e=>{if(e.key==="Enter")pok()});m.querySelector("#unl").onclick=()=>{S.all=!S.all;save();m.remove();render()};m.querySelector("#rst").onclick=()=>{S=Object.assign(fresh(),{ok:true});save();m.remove();render()};m.querySelector("#cls").onclick=()=>m.remove()}});
window.claude?.hot?.snapshot?.(()=>S);
const boot=data=>{const hot=!!(data&&data.scr);if(hot)S=Object.assign(fresh(),data);render();if(!hot&&S.ok&&S.noms)askResume();const a=S.scr==="lvl"?LV[S.lv].acts[S.ai]:null;if(a&&a.type==="boss"){const b=A(a.id).sel;if(b.i>=0&&b.i<a.qs.length){b.ts=Date.now();tick()}}};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
